<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>网络优先级</title><link rel="icon" href="/favicon.ico">
<style>
:root{--ink:#172c40;--muted:#758390;--line:#e1e8ed;--blue:#1869d5;--bg:#f3f6f9;--teal:#187d73}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:14px}button{font:inherit;cursor:pointer}button:focus-visible,[draggable]:focus-visible{outline:3px solid #8fbafa;outline-offset:4px}button:disabled{opacity:.5;cursor:wait}.shell{max-width:1000px;margin:0 auto;padding:34px 36px 26px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:47px}.brand{display:flex;gap:12px;align-items:center;font-size:16px;font-weight:650}.logo{width:38px;height:38px;border-radius:12px;background:var(--blue);color:white;display:grid;place-items:center;box-shadow:0 4px 12px #1869d51d}.logo svg{width:23px;height:23px}.local{display:flex;align-items:center;gap:8px;color:#637988;font-size:12px}.dot{width:6px;height:6px;background:#2ca581;border-radius:50%;display:inline-block}.eyebrow{font-size:11px;letter-spacing:2.1px;color:var(--blue);font-weight:700;margin-bottom:13px}h1{font-size:32px;letter-spacing:-1px;line-height:1.35;margin:0 0 12px;font-weight:650}.intro p{margin:0;color:#697c8d;font-size:14px;line-height:1.8}.overview{display:grid;grid-template-columns:1.35fr 1fr 1fr;background:white;border:1px solid var(--line);border-radius:15px;margin-top:28px;padding:20px 24px;box-shadow:0 2px 4px #24354902}.stat{padding:0 24px;border-left:1px solid var(--line)}.stat:first-child{padding-left:0;border:0}.label{font-size:11px;color:var(--muted);margin-bottom:8px}.value{font-size:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.value .small{font-size:12px;color:var(--muted);font-weight:400}.sectionbar{display:flex;align-items:center;justify-content:space-between;margin:31px 0 13px}.sectiontitle{font-size:13px;font-weight:650;display:flex;align-items:center;gap:8px}.count{font-size:11px;background:#e5ebf1;border-radius:5px;padding:2px 6px;color:#637789}.refresh{background:none;border:0;color:#637d94;padding:6px;font-size:12px;display:flex;gap:7px;align-items:center}.refresh svg{width:14px;height:14px}.guide{display:flex;justify-content:space-between;color:#8c99a5;font-size:10px;letter-spacing:.5px;margin:0 5px 10px 40px}.list{display:flex;flex-direction:column;gap:10px;min-height:150px}.card{position:relative;display:grid;grid-template-columns:20px 26px 42px minmax(0,1fr) 120px 58px;gap:13px;align-items:center;background:white;border:1px solid var(--line);border-radius:13px;padding:20px 19px 20px 14px;transition:border-color .16s,box-shadow .16s,opacity .16s;user-select:none}.card:hover{border-color:#bacbdc;box-shadow:0 4px 15px #1d365b06}.card.primary{border-color:#b4ceee;background:linear-gradient(100deg,#f6faff 0%,white 65%)}.card.dragging{opacity:.38;border:1px dashed var(--blue);box-shadow:none}.grip{color:#acb7c2;cursor:grab;display:grid;place-items:center;height:30px}.grip:active{cursor:grabbing}.grip svg{width:15px;height:22px}.rank{font-size:13px;color:#9aa7b3;font-variant-numeric:tabular-nums}.primary .rank{color:var(--blue);font-weight:700}.deviceicon{display:grid;place-items:center;width:40px;height:40px;color:#57809a;border-radius:11px;background:#edf3f7}.primary .deviceicon{background:#e6f0ff;color:var(--blue)}.deviceicon svg{width:22px;height:22px}.devicename{display:flex;gap:9px;align-items:center;flex-wrap:wrap;font-size:14px;font-weight:650;margin-bottom:6px}.badge{font-size:10px;font-weight:400;padding:3px 7px;border-radius:5px;background:#eaf2ff;color:#3972b3}.description{font-size:11px;color:#81909c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.75}.meta{font-size:11px;color:#788c9e;margin-top:7px;display:flex;gap:12px;flex-wrap:wrap}.status{text-align:right;font-size:11px}.statusline{display:flex;align-items:center;justify-content:flex-end;gap:6px;color:#438472;margin-bottom:7px}.statusline.off{color:#98a2ac}.statusline.off .dot{background:#b8c0c8}.speed{color:#8c99a5;font-size:11px}.nudge{display:flex;justify-content:flex-end;gap:3px}.nudge button{background:#fff;border:1px solid #e7edf2;border-radius:5px;color:#8799a9;width:25px;height:27px;padding:0;font-size:14px}.nudge button:hover:not(:disabled){background:#edf4ff;color:var(--blue)}.nudge button:disabled{opacity:.25;cursor:default}.note{margin:17px 3px 0;display:flex;gap:9px;align-items:flex-start;color:#81909e;line-height:1.8;font-size:11px}.note svg{flex-shrink:0;width:14px;height:14px;margin-top:3px}.actions{margin-top:27px;padding-top:24px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:16px}.savestate{color:#7d8e9c;font-size:12px;display:flex;align-items:center;gap:7px}.savestate.unsaved{color:#ab791f}.buttons{display:flex;gap:10px}.btn{border:1px solid #d9e2ea;border-radius:8px;padding:11px 20px;color:#536c82;background:white;font-size:13px;min-width:115px;transition:background .15s}.btn:hover:not(:disabled){background:#f6f8fb}.btn.save{border-color:var(--blue);background:var(--blue);color:white;box-shadow:0 3px 8px #1869d51a}.btn.save:hover:not(:disabled){background:#125dbf}.footer{display:flex;justify-content:space-between;margin-top:27px;color:#a0acb6;font-size:10px}.message{display:none;border-radius:8px;padding:11px 14px;line-height:1.7;margin-top:18px;font-size:12px}.message.show{display:block}.message.good{background:#e7f4ef;color:#286b54;border:1px solid #c9e5d9}.message.bad{background:#fff0ed;color:#a54d3d;border:1px solid #efd5cf}.message.info{background:#e9f1fc;color:#3d6897;border:1px solid #cfdef1}.empty{padding:38px;text-align:center;background:white;border:1px dashed #ced9e2;border-radius:12px;color:#8494a3}.busy .card{pointer-events:none}.spin{display:inline-block;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:720px){.shell{padding:24px 17px}.top{margin-bottom:33px}h1{font-size:27px}.overview{padding:17px 15px;grid-template-columns:1.4fr 1fr}.stat{padding:0 15px}.stat:last-child{display:none}.card{grid-template-columns:15px 18px 34px minmax(0,1fr) 50px;gap:8px;padding:17px 12px}.deviceicon{width:33px;height:33px}.status{display:none}.description{font-size:10px}.meta{gap:8px;font-size:10px}.local{font-size:10px}.actions{flex-wrap:wrap}.buttons{margin-left:auto}.guide{margin-left:27px}.footer{font-size:9px}.value{font-size:14px}}
.top{margin-bottom:24px}.overview{margin-top:0}
</style>
</head>
<body><main class="shell">
<header class="top"><div class="brand"><span class="logo" id="brandIcon"></span>网络优先级</div><div class="local"><span class="dot"></span><span id="host">本机控制台</span></div></header>
<section class="overview" aria-label="当前网络概况"><div class="stat"><div class="label">当前 IPv4 首选接口</div><div class="value" id="preferred">正在读取…</div></div><div class="stat"><div class="label">已连接 / 全部接口</div><div class="value" id="connected">—</div></div><div class="stat"><div class="label">优先级设置</div><div class="value" id="mode">—</div></div></section>
<div class="sectionbar"><div class="sectiontitle">接口优先级 <span class="count" id="count">—</span></div><button class="refresh" id="refresh" title="重新读取系统接口与顺序"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6 7a7 7 0 0 1 12-1l2 3M4 15l2 3a7 7 0 0 0 12-1"/></svg>重新读取</button></div>
<div class="guide"><span>高优先级 ↑</span><span>拖动左侧手柄，或使用右侧箭头</span></div>
<div id="list" class="list" aria-label="拖动调整网络接口顺序"><div class="empty">正在读取当前网络接口…</div></div>
<div class="note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7v1"/></svg><span>顺序用于选择可用网络，IPv4 / IPv6 同时保存。已建立的连接可能继续沿用原接口；针对特定地址的路由仍按 Windows 路由规则选择。</span></div>
<div id="message" class="message" role="status" aria-live="polite"></div>
<div class="actions"><div class="savestate" id="savestate"><span class="dot"></span>正在读取系统设置</div><div class="buttons"><button id="exit" class="btn" style="min-width:66px;padding:11px 16px" disabled title="退出程序，保留已保存的排序">退出</button><button id="defaults" class="btn" disabled title="恢复 Windows 自动优先级，成功后退出程序">恢复默认并退出</button><button id="save" class="btn save" disabled>保存</button></div></div>
<footer class="footer"><span>仅在本机运行 · 数据不上传</span><span id="readAt">读取 Windows 网络配置</span></footer>
</main>
<script>
const icons={network:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linejoin="round"><rect x="8" y="3" width="8" height="6" rx="1.3"/><rect x="2" y="16" width="7" height="5" rx="1.2"/><rect x="15" y="16" width="7" height="5" rx="1.2"/><path d="M12 9v4M5.5 16v-3h13v3"/></svg>',wired:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h14v12h-4v4H9v-4H5z"/><path d="M8 4v5M12 4v5M16 4v5M9 20h6"/></svg>',wifi:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M2 8a16 16 0 0 1 20 0M5.5 11.5a10 10 0 0 1 13 0M9 15a5 5 0 0 1 6 0"/><circle cx="12" cy="19" r="1" fill="currentColor" stroke="none"/></svg>',virtual:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="m12 3 9 5-9 5-9-5zM3 12l9 5 9-5M3 16l9 5 9-5"/></svg>',grip:'<svg viewBox="0 0 12 20" fill="currentColor"><circle cx="3" cy="4" r="1.3"/><circle cx="9" cy="4" r="1.3"/><circle cx="3" cy="10" r="1.3"/><circle cx="9" cy="10" r="1.3"/><circle cx="3" cy="16" r="1.3"/><circle cx="9" cy="16" r="1.3"/></svg>'};
document.getElementById('brandIcon').innerHTML=icons.network;
const $=id=>document.getElementById(id), token=location.hash.slice(1);let state=null,baseline=[],dirty=false,busy=false,dragged=null,readOnly=false,exited=false;
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function message(text,type='info'){const el=$('message');el.textContent=text;el.className='message show '+type;}
function updateControls(){for(const id of ['refresh','save','defaults','exit'])$(id).disabled=busy||exited||(!state&&id!=='refresh'&&id!=='exit');document.body.classList.toggle('busy',busy||exited);$('save').textContent=busy?'请稍候…':'保存';$('savestate').classList.toggle('unsaved',dirty&&!exited);$('savestate').innerHTML='<span class="dot" style="background:'+(dirty&&!exited?'#c7983d':'#86a291')+'"></span>'+(exited?'程序已退出':busy?'正在处理，请稍候':dirty?'顺序已调整，保存后生效':readOnly?'只读预览 · 未修改网络设置':'当前顺序已从系统读取');}
async function api(path,data){const options={headers:{'X-Network-Token':token},cache:'no-store'};if(data!==undefined){options.method='POST';options.headers['Content-Type']='application/json';options.body=JSON.stringify(data);}let response;try{response=await fetch('/api/'+path,options);}catch{throw Error('本机程序未连接。请重新打开 EXE，然后从托盘打开控制页。');}const value=await response.json();if(!response.ok||!value.ok)throw Error(value.error||'读取失败，请重试。');return value;}
function render(){const list=$('list');if(!state.adapters.length){list.innerHTML='<div class="empty">未发现可管理的网络接口。连接网卡后点击“重新读取”。</div>';return;}list.innerHTML=state.adapters.map((a,i)=>{const f4=a.families.find(f=>f.family==='IPv4'),f6=a.families.find(f=>f.family==='IPv6');const mode=a.families.length&&a.families.every(f=>f.automatic)?'自动':'手动';return `<article class="card ${a.id===state.preferredId?'primary':''}" draggable="true" data-id="${a.id}" aria-label="优先级 ${i+1}，${escapeHtml(a.name)}，${a.connected?'已连接':'未连接'}"><span class="grip" title="按住拖动">${icons.grip}</span><span class="rank">${String(i+1).padStart(2,'0')}</span><span class="deviceicon">${icons[a.kind]||icons.virtual}</span><div><div class="devicename">${escapeHtml(a.name)}${a.id===state.preferredId?'<span class="badge">当前首选</span>':''}</div><div class="description" title="${escapeHtml(a.description)}">${escapeHtml(a.description)}</div><div class="meta"><span>${a.kind==='wifi'?'Wi-Fi':a.kind==='virtual'?'虚拟接口':'有线 / USB'}</span><span>${escapeHtml(a.addresses.filter(ip=>!ip.startsWith('169.254.')).join(' · ')||'暂无 IPv4 地址')}</span><span title="接口跃点值；数值越小越优先">${mode} · v4 ${f4?f4.metric:'—'} / v6 ${f6?f6.metric:'—'}</span></div></div><div class="status"><div class="statusline ${a.connected?'':'off'}"><span class="dot"></span>${a.connected?'已连接':'未连接'}</div><div class="speed">${a.connected?escapeHtml(a.speed):'连接后参与选择'}</div></div><div class="nudge"><button data-move="-1" ${i===0?'disabled':''} title="上移 ${escapeHtml(a.name)}" aria-label="上移 ${escapeHtml(a.name)}">↑</button><button data-move="1" ${i===state.adapters.length-1?'disabled':''} title="下移 ${escapeHtml(a.name)}" aria-label="下移 ${escapeHtml(a.name)}">↓</button></div></article>`;}).join('');}
function acceptState(value){state=value.state;if('readOnly'in value)readOnly=value.readOnly;baseline=state.adapters.map(a=>a.id);dirty=false;$('host').textContent=state.computer+' · '+(readOnly?'只读预览':state.admin?'管理员模式':'只读模式');const preferred=state.adapters.find(a=>a.id===state.preferredId);$('preferred').textContent=preferred?preferred.name:'暂无可用默认路由';$('connected').innerHTML=state.adapters.filter(a=>a.connected).length+' <span class="small">/ '+state.adapters.length+' 个接口</span>';$('count').textContent=state.adapters.length;const families=state.adapters.flatMap(a=>a.families);$('mode').textContent=families.length&&families.every(f=>f.automatic)?'Windows 自动':families.every(f=>!f.automatic)?'手动排序':'自动 / 手动混合';$('readAt').textContent='最近读取 '+state.readAt;render();}
function markDirty(){dirty=state.adapters.some((a,i)=>a.id!==baseline[i]);updateControls();}
async function load(){if(busy)return;busy=true;updateControls();try{acceptState(await api('state'));$('message').className='message';if(readOnly)message('这是功能检查用的只读预览，网卡状态来自本机。正式使用请双击 EXE。');}catch(e){message(e.message,'bad');if(!state)$('list').innerHTML='<div class="empty">暂时无法读取接口，请点击“重新读取”。</div>';}finally{busy=false;updateControls();}}
$('list').addEventListener('click',event=>{const button=event.target.closest('[data-move]');if(!button||busy)return;const id=Number(button.closest('[data-id]').dataset.id),i=state.adapters.findIndex(a=>a.id===id),j=i+Number(button.dataset.move);if(j<0||j>=state.adapters.length)return;[state.adapters[i],state.adapters[j]]=[state.adapters[j],state.adapters[i]];render();markDirty();const next=document.querySelector(`[data-id="${id}"] [data-move="${button.dataset.move}"]`);if(next&&!next.disabled)next.focus();});
$('list').addEventListener('dragstart',event=>{if(busy){event.preventDefault();return;}dragged=event.target.closest('.card');if(!dragged)return;event.dataTransfer.effectAllowed='move';event.dataTransfer.setData('text/plain',dragged.dataset.id);dragged.classList.add('dragging');});
$('list').addEventListener('dragover',event=>{if(!dragged)return;event.preventDefault();event.dataTransfer.dropEffect='move';const target=event.target.closest('.card');if(target&&target!==dragged){const rect=target.getBoundingClientRect();$('list').insertBefore(dragged,event.clientY<rect.top+rect.height/2?target:target.nextSibling);}});
$('list').addEventListener('drop',event=>event.preventDefault());
$('list').addEventListener('dragend',()=>{if(!dragged)return;const order=[...$('list').querySelectorAll('.card')].map(el=>Number(el.dataset.id));state.adapters=order.map(id=>state.adapters.find(a=>a.id===id));dragged=null;render();markDirty();});
$('refresh').addEventListener('click',load);
async function apply(action){if(busy||exited||(!state&&action!=='exit'))return;busy=true;updateControls();try{const value=await api(action,action==='save'?{order:state.adapters.map(a=>({id:a.id,guid:a.guid}))}:{});if(value.state)acceptState(value);if(value.exiting){exited=true;dirty=false;$('host').textContent='本机程序已退出';}message(value.message+(value.exiting?' 可以关闭此网页。':''),'good');}catch(e){message(e.message,'bad');}finally{busy=false;updateControls();}}
$('save').addEventListener('click',()=>apply('save'));$('defaults').addEventListener('click',()=>apply('defaults'));$('exit').addEventListener('click',()=>apply('exit'));
if(!token){message('请双击 EXE，或从系统托盘打开已授权的控制页。','bad');$('list').innerHTML='<div class="empty">等待从本机程序打开</div>';updateControls();}else load();
</script>
</body></html>
